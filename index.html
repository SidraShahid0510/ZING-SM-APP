<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zing-login</title>
    <meta
      name="description"
      content="Zing - Connect, share, and engage with friends on our vibrant social media platform. Log in to start sharing posts, exploring content, and staying connected with your community."
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/css/main.css" />
    <link rel="icon" type="image/x-icon" href="images/favicon.ico.png" />
  </head>
  <body>
    <div
      class="container min-vh-100 d-flex flex-column align-items-center mt-5 py-4 auth"
    >
      <img
        src="images/zing-logo.svg"
        alt="Zing logo"
        class="auth-logo d-block mx-auto mb-3 mb-lg-5"
      />
      <div class="auth-wrap mx-auto my-4">
        <div class="row justify-content-center">
          <div class="col-12 col-lg-10">
            <div class="row g-0 auth-card">
              <!-- right form -->
              <div class="col-12 col-md-6 order-1 order-md-2 auth-right">
                <img src="images/login-img.jpg" alt="zing illustration" />
                <p class="mb-0">say it. share it. zing it</p>
              </div>
              <!-- left form -->
              <div class="col-12 col-md-6 order-2 order-md-1 auth-left">
                <h1 class="h3 text-center mb-3">LOGIN</h1>
                <form id="form" class="mt-4">
                  <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input
                      id="email"
                      type="email"
                      class="form-control rounded-pill"
                      placeholder="sidra@stud.noroff.no"
                      name="email"
                      required
                    />
                    <div class="invalid-feedback">
                      Please enter a valid email.
                    </div>
                  </div>
                  <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input
                      id="password"
                      type="password"
                      name="password"
                      class="form-control rounded-pill"
                      placeholder="••••••••"
                      required
                    />
                    <div class="invalid-feedback">Password is required.</div>
                  </div>
                  <div
                    class="message text-danger small"
                    id="message"
                    role="alert"
                  ></div>

                  <button
                    type="submit"
                    class="btn btn-primary rounded-pill w-100 my-3"
                    id="form-btn"
                  >
                    Login
                  </button>
                  <p class="mt-3 auth-meta">
                    Don’t have an account? <a href="register.html">Register</a>
                  </p>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div
        id="loader"
        class="loader-overlay"
        aria-hidden="true"
        style="display: none"
      >
        <div class="spinner-border" role="status"></div>
      </div>
    </div>

    <script src="JS/login.js"></script>
  </body>
</html>
